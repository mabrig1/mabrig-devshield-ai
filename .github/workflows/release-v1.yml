name: Release DevShield v1

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'SemVer without the leading v, for example 1.3.0'
        required: true
        default: '1.3.0'
        type: string
      confirm:
        description: 'Type RELEASE to publish'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: devshield-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Require explicit release confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "${CONFIRM}" = "RELEASE" || { echo 'Confirmation must be RELEASE.' >&2; exit 1; }

      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Verify version and release notes
        env:
          VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "${VERSION}" = "${PACKAGE_VERSION}" || {
            echo "Requested ${VERSION}, but package.json is ${PACKAGE_VERSION}." >&2
            exit 1
          }
          NOTES="docs/RELEASE-NOTES-V${VERSION}.md"
          test -s "${NOTES}" || { echo "Missing ${NOTES}." >&2; exit 1; }
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "Release v${VERSION} already exists." >&2
            exit 1
          fi

      - name: Run regression suite
        run: npm test

      - name: Run release self-scan
        uses: ./
        with:
          fail-on: critical
          comment: false
          scan-scope: repository
          dependency-review: false
          exclude-paths: 'test/**'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --target "$GITHUB_SHA" \
            --title "MABRIG DevShield AI v${VERSION}" \
            --notes-file "docs/RELEASE-NOTES-V${VERSION}.md"

      - name: Advance stable v1 compatibility branch
        run: |
          git fetch origin v1
          git push origin "$GITHUB_SHA:refs/heads/v1"

      - name: Release summary
        env:
          VERSION: ${{ inputs.version }}
        run: |
          {
            echo "## MABRIG DevShield AI v${VERSION}"
            echo '- Regression suite: PASS'
            echo '- Release self-scan: PASS'
            echo '- GitHub Release: PUBLISHED'
            echo '- Stable v1 ref: ADVANCED'
            echo ''
            echo 'For the first Marketplace publication, complete the GitHub Marketplace UI submission after this workflow finishes.'
          } >> "$GITHUB_STEP_SUMMARY"
