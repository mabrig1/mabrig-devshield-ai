name: DevShield Worker Build Validation

on:
  pull_request:
    paths:
      - 'cloudflare-deploy/**'
      - '.github/workflows/cloudflare-build-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-dry-run:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare-deploy
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate worker entry point and HTTP behavior
        run: npm test
      - name: Install isolated Wrangler dependency
        run: npm install --no-audit --no-fund
      - name: Bundle Worker without deploying it or reading production secrets
        run: npx wrangler deploy --dry-run --outdir .dry-run
      - name: Verify repository-root Wrangler configuration without deploying
        run: npx wrangler deploy --config ../wrangler.jsonc --dry-run --outdir .dry-run-root
      - name: Verify a Worker bundle exists
        run: test -n "$(find .dry-run -maxdepth 1 -type f -name '*.js' -print -quit)"
