name: DevShield Threat Intelligence Agent
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: devshield-threat-intel
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect security advisories
        run: node scripts/threat-intel-agent.mjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: devshield-threat-intel
          path: reports/threat-intel-latest.json
          retention-days: 30
          if-no-files-found: warn
      - name: Create review issue when collector fails
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Threat intelligence collector requires review" --body "The scheduled advisory collector failed. Inspect the workflow logs and evidence artifact. Do not assume a failed fetch means no vulnerabilities." || true
