name: 'MABRIG DevShield AI'
description: 'Security-first pull request review with agentic dependency intelligence, diff-aware checks, approval-gated remediation proposals, SARIF, and optional AI analysis.'
author: 'MABRIG Technologies'
inputs:
  github-token:
    description: 'GitHub token used for PR comments and optional GitHub dependency review.'
    required: false
    default: ''
  openrouter-api-key:
    description: 'Optional OpenRouter key for AI-assisted review. Leave blank for deterministic-only mode.'
    required: false
    default: ''
  model:
    description: 'OpenRouter model slug.'
    required: false
    default: 'openrouter/auto'
  fail-on:
    description: 'Fail at or above: critical, high, medium, low, none.'
    required: false
    default: 'critical'
  comment:
    description: 'Post or update a PR comment when running on pull_request.'
    required: false
    default: 'true'
  max-files:
    description: 'Maximum text files to scan.'
    required: false
    default: '120'
  max-file-bytes:
    description: 'Maximum bytes read from each text file.'
    required: false
    default: ''
  exclude-paths:
    description: 'Comma-separated path globs to exclude, for example test/**,fixtures/**.'
    required: false
    default: ''
  config-file:
    description: 'Repository-relative JSON policy file.'
    required: false
    default: '.devshield.json'
  policy:
    description: 'Rule policy: balanced, strict, or secrets-only.'
    required: false
    default: ''
  scan-scope:
    description: 'Scan scope: changed-lines, changed-files, repository, or staged (local CLI only).'
    required: false
    default: ''
  inline-suppressions:
    description: 'Allow devshield:ignore comments for non-critical findings.'
    required: false
    default: ''
  dependency-review:
    description: 'Use GitHub dependency review on pull requests: auto, true, or false.'
    required: false
    default: ''
  dependency-severity:
    description: 'Minimum dependency vulnerability severity to report: critical, high, medium/moderate, low.'
    required: false
    default: ''
  dependency-deny-licenses:
    description: 'Comma-separated SPDX license identifiers to reject for newly introduced dependencies.'
    required: false
    default: ''
  baseline-file:
    description: 'Repository-relative DevShield baseline JSON file.'
    required: false
    default: ''
  baseline-mode:
    description: 'Baseline behavior: new-only, report, or off.'
    required: false
    default: ''
  agentic-mode:
    description: 'Agentic security loop: off, plan, or ai. plan is deterministic and advisory.'
    required: false
    default: ''
  remediation-mode:
    description: 'Remediation proposal mode: off or propose. The Action never applies source mutations.'
    required: false
    default: ''
  dependency-agentic:
    description: 'Agentic dependency correlation: off, auto, or on. Correlates lockfile evidence, source references, dependency review, and CI/runtime context.'
    required: false
    default: ''
  sarif:
    description: 'Write a SARIF 2.1.0 report for GitHub Code Scanning or other SARIF consumers.'
    required: false
    default: 'true'
  report-dir:
    description: 'Repository-relative output directory for JSON, SARIF, and baseline candidate reports.'
    required: false
    default: '.devshield'
  cloud-api-url:
    description: 'Optional HTTPS DevShield Cloud ingestion endpoint. Disabled when omitted.'
    required: false
    default: ''
  cloud-token:
    description: 'Optional DevShield Cloud installation token. Store as a GitHub Actions secret.'
    required: false
    default: ''
  cloud-required:
    description: 'Fail the scan if Cloud export is configured but cannot complete.'
    required: false
    default: 'false'
outputs:
  findings-count:
    description: 'Total findings, including baseline-existing findings.'
    value: ${{ steps.devshield.outputs.findings-count }}
  new-findings:
    description: 'Findings not present in the configured baseline.'
    value: ${{ steps.devshield.outputs.new-findings }}
  existing-findings:
    description: 'Findings already present in the configured baseline.'
    value: ${{ steps.devshield.outputs.existing-findings }}
  dependency-findings:
    description: 'Dependency vulnerability/license findings.'
    value: ${{ steps.devshield.outputs.dependency-findings }}
  dependency-review-status:
    description: 'Dependency review status: success, unavailable, skipped, disabled, or fixture.'
    value: ${{ steps.devshield.outputs.dependency-review-status }}
  risk-score:
    description: 'Risk score from 0 to 100 for findings that participate in the merge gate.'
    value: ${{ steps.devshield.outputs.risk-score }}
  risk-level:
    description: 'Risk level: low, medium, high, or critical.'
    value: ${{ steps.devshield.outputs.risk-level }}
  scanned-files:
    description: 'Number of files selected for scanning.'
    value: ${{ steps.devshield.outputs.scanned-files }}
  ignored-findings:
    description: 'Number of findings suppressed by inline policy.'
    value: ${{ steps.devshield.outputs.ignored-findings }}
  report-file:
    description: 'Path to the generated JSON report.'
    value: ${{ steps.devshield.outputs.report-file }}
  sarif-file:
    description: 'Path to the generated SARIF report, when enabled.'
    value: ${{ steps.devshield.outputs.sarif-file }}
  baseline-output-file:
    description: 'Path to a generated baseline candidate containing current finding fingerprints.'
    value: ${{ steps.devshield.outputs.baseline-output-file }}
  cloud-export-status:
    description: 'Cloud export status: disabled, success, failed, misconfigured, or fixture.'
    value: ${{ steps.devshield.outputs.cloud-export-status }}
  agentic-state:
    description: 'Agentic mission state: disabled, remediation-ready, or verified-clean.'
    value: ${{ steps.devshield.outputs.agentic-state }}
  agentic-tasks:
    description: 'Number of remediation tasks proposed by the agentic engine.'
    value: ${{ steps.devshield.outputs.agentic-tasks }}
  agentic-attack-paths:
    description: 'Number of heuristic candidate attack paths.'
    value: ${{ steps.devshield.outputs.agentic-attack-paths }}
  agentic-plan-file:
    description: 'Path to the machine-readable agentic plan.'
    value: ${{ steps.devshield.outputs.agentic-plan-file }}
  agentic-plan-markdown:
    description: 'Path to the human-readable agentic plan.'
    value: ${{ steps.devshield.outputs.agentic-plan-markdown }}
  remediation-candidates:
    description: 'Number of exact allowlisted remediation candidates.'
    value: ${{ steps.devshield.outputs.remediation-candidates }}
  remediation-manual-only:
    description: 'Number of tasks that remain human-only.'
    value: ${{ steps.devshield.outputs.remediation-manual-only }}
  remediation-plan-file:
    description: 'Path to the machine-readable remediation proposal.'
    value: ${{ steps.devshield.outputs.remediation-plan-file }}
  remediation-plan-markdown:
    description: 'Path to the human-readable remediation proposal.'
    value: ${{ steps.devshield.outputs.remediation-plan-markdown }}
  dependency-agentic-state:
    description: 'Dependency mission state: disabled, no-lockfile, invalid-lockfile, no-signals, or investigate.'
    value: ${{ steps.devshield.outputs.dependency-agentic-state }}
  dependency-agentic-packages:
    description: 'Number of dependency packages prioritized for investigation.'
    value: ${{ steps.devshield.outputs.dependency-agentic-packages }}
  dependency-agentic-paths:
    description: 'Number of dependency attack-path hypotheses.'
    value: ${{ steps.devshield.outputs.dependency-agentic-paths }}
  dependency-agentic-references:
    description: 'Number of direct application source references linked to prioritized packages.'
    value: ${{ steps.devshield.outputs.dependency-agentic-references }}
  dependency-agentic-plan-file:
    description: 'Path to the machine-readable dependency mission.'
    value: ${{ steps.devshield.outputs.dependency-agentic-plan-file }}
  dependency-agentic-plan-markdown:
    description: 'Path to the human-readable dependency mission.'
    value: ${{ steps.devshield.outputs.dependency-agentic-plan-markdown }}
runs:
  using: 'composite'
  steps:
    - id: devshield
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_OPENROUTER_API_KEY: ${{ inputs.openrouter-api-key }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_COMMENT: ${{ inputs.comment }}
        INPUT_MAX_FILES: ${{ inputs.max-files }}
        INPUT_MAX_FILE_BYTES: ${{ inputs.max-file-bytes }}
        INPUT_EXCLUDE_PATHS: ${{ inputs.exclude-paths }}
        INPUT_CONFIG_FILE: ${{ inputs.config-file }}
        INPUT_POLICY: ${{ inputs.policy }}
        INPUT_SCAN_SCOPE: ${{ inputs.scan-scope }}
        INPUT_INLINE_SUPPRESSIONS: ${{ inputs.inline-suppressions }}
        INPUT_DEPENDENCY_REVIEW: ${{ inputs.dependency-review }}
        INPUT_DEPENDENCY_SEVERITY: ${{ inputs.dependency-severity }}
        INPUT_DEPENDENCY_DENY_LICENSES: ${{ inputs.dependency-deny-licenses }}
        INPUT_BASELINE_FILE: ${{ inputs.baseline-file }}
        INPUT_BASELINE_MODE: ${{ inputs.baseline-mode }}
        INPUT_AGENTIC_MODE: ${{ inputs.agentic-mode }}
        INPUT_REMEDIATION_MODE: ${{ inputs.remediation-mode }}
        INPUT_DEPENDENCY_AGENTIC: ${{ inputs.dependency-agentic }}
        INPUT_SARIF: ${{ inputs.sarif }}
        INPUT_REPORT_DIR: ${{ inputs.report-dir }}
        INPUT_CLOUD_API_URL: ${{ inputs.cloud-api-url }}
        INPUT_CLOUD_TOKEN: ${{ inputs.cloud-token }}
        INPUT_CLOUD_REQUIRED: ${{ inputs.cloud-required }}
      run: node "$GITHUB_ACTION_PATH/src/index.mjs"
branding:
  icon: 'shield'
  color: 'purple'
